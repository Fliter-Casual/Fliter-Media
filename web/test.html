<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 基础与 SDP 处理 - 测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {

            font-size: 1.8rem;
            color: #64b5f6;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 600;
            color: #81c784;
        }

        .card-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #aaa;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #64b5f6;
        }

        .btn-group {
            display: flex;
            gap: 10px;
			margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4caf50;
            color: white;
        }

        .btn-primary:hover {
            background: #43a047;
        }

        .btn-primary:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #e53935;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-new {
            background: #616161;
        }

        .status-connecting {
            background: #ff9800;
            color: #000;
        }

        .status-connected {
            background: #4caf50;
        }

        .status-failed {
            background: #f44336;
        }

        .status-closed {
            background: #9e9e9e;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            margin-bottom: 16px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .log-panel {
            grid-column: 1 / -1;
        }

        .log-content {
            height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono',monospace;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .log-time {
            color: #666;
            margin-right: 8px;
        }

        .log-info {
            color: #81c784;
        }

        .log-warn {
            color: #ffb74d;
        }

        .log-error {
            color: #ef5350;
        }

        .log-sdp {
            color: #64b5f6;
		}

        .sdp-panel {
            margin-top: 20px;
        }

        .sdp-content {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #aaa;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #64b5f6;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 页头 -->
        <header>
            <h1>
                WebRTC 基础与 SDP 处理</h1>
            <p class="subtitle">学习 WebRTC 连接建立、SDP 协商和 ICE 候选交换</p>
        </header>
        <div class="main-grid">
            <!-- 左侧：连接配置 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">
                        连接配置</span>
                    <span id="statusBadge" class="status-badge status-new">未连接</span>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>服务器地址</label>
                        <input type="text" id="serverUrl" placeholder="http://localhost:8090">
                    </div>

                    <div class="btn-group">
                        <button id="btnConnect" class="btn-primary" onclick="connect()">
                            建立连接
                        </button>
                        <button id="btnDisconnect" class="btn-danger" onclick="disconnect()" disabled>
                            断开连接
                        </button>
                    </div>

                    <!-- 统计信息 -->
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div id="statIceState" class="stat-value">-</div>
                            <div class="stat-label">ICE 状态</div>
                        </div>
                        <div class="stat-item">
                            <div id="statSignalState" class="stat-value">-</div>
                            <div class="stat-label">信令状态</div>
                        </div>
                        <div class="stat-item">
                            <div id="statLocalCand" class="stat-value">0</div>
                            <div class="stat-label">本地候选</div>
                        </div>
                        <div class="stat-item">
                            <div id="statRemoteCand" class="stat-value">0</div>
                            <div class="stat-label">远端候选</div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 右侧：视频预览 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">
                        本地视频预览</span>
                </div>
                <div class="card-body">
                    <div class="video-container">
                        <video id="localVideo" autoplay muted playsinline></video>
                        <span class="video-label">Local</span>
                    </div>
                    <button class="btn-primary" onclick="startPreview()" style="width:100%">

                        开启摄像头预览
                    </button>
                </div>
            </div>
            <!-- 日志面板（横跨两列） -->
            <div class="card log-panel">
                <div class="card-header">
                    <span class="card-title">
                        连接日志</span>
                    <button onclick="clearLogs()" style="padding:6px 12px;font-size:0.8rem">
                        清空</button>
                </div>
                <div class="card-body">
                    <div id="logContent" class="log-content"></div>
                </div>
            </div>
            <!-- SDP 查看（横跨两列） -->
            <div class="card" style="grid-column: 1 / -1">
                <div class="card-header">
                    <span class="card-title">
                        SDP 详情（点击展开）</span>
                </div>
                <div class="card-body">
                    <details>
                        <summary style="cursor:pointer;margin-bottom:10px">Offer
                            SDP</summary>
                        <div id="offerSdp" class="sdp-content">等待连接...</div>
                    </details>
                    <details style="margin-top:16px">
                        <summary style="cursor:pointer;margin-bottom:10px">Answer
                            SDP</summary>
                        <div id="answerSdp" class="sdp-content">等待连接...</div>
                    </details>
                </div>
            </div>
        </div>
    </div>
    <script>
        <!--JavaScript 核心-->
        // ========== 全局变量 ==========
        let pc = null;
        let localStream = null;
        let localCandidateCount = 0;
        let remoteCandidateCount = 0;
        let peerId = null;
        // RTCPeerConnection 对象
        // 本地媒体流
        // 本地候选计数
        // 远端候选计数
        // 服务器分配的 Peer ID

        // ========== 工具函数 ==========
        function $(id) {
            return document.getElementById(id);
        }

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const logContent = $('logContent');
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${msg}</span>`;
            logContent.appendChild(line);
            logContent.scrollTop = logContent.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        function clearLogs() {
            $('logContent').innerHTML = '';
        }

        function updateStatus(state) {
            const badge = $('statusBadge');
            badge.className = 'status-badge status-' + state.toLowerCase();
            badge.textContent = {
                'new': '未连接',
                'connecting': '连接中...',
                'connected': '已连接',
                'disconnected': '已断开',
                'failed': '连接失败',
                'closed': '已关闭'
            }[state.toLowerCase()] || state;
        }

        function updateStats() {
            $('statLocalCand').textContent = localCandidateCount;
            $('statRemoteCand').textContent = remoteCandidateCount;
            if (pc) {
                $('statIceState').textContent = pc.iceConnectionState || '-';
                $('statSignalState').textContent = pc.signalingState || '-';
            }
        }

        // ========== 初始化 ==========
        window.onload = function () {
            // 自动设置服务器地址
            const host = window.location.hostname || 'localhost';
            $('serverUrl').value = `http://${host}:8090`;
        };
        log('页面加载完成，准备就绪', 'info');
        log('点击「建立连接」开始 WebRTC 协商流程', 'info');

        // ========== 开启摄像头预览 ==========
        async function startPreview() {
            try {
                log('正在请求摄像头权限...', 'info');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: true
                });
                $('localVideo').srcObject = localStream;
				$('btnStartPreview').disabled = true;
                $('btnStopPreview').disabled = false;
                log('摄像头已开启', 'info');
            } catch (e) {
                log('摄像头打开失败: ' + e.message, 'error');
            }
        }

// ========== 关闭摄像头预览 ==========
        function stopPreview() {
            if (localStream) {
                log('正在关闭摄像头...', 'info');
                // 停止所有轨道
                localStream.getTracks().forEach(track => {
                    track.stop();
                    log(`   - 停止轨道: ${track.kind}`, 'info');
                });
                // 清空视频源
                $('localVideo').srcObject = null;
                localStream = null;

                $('btnStartPreview').disabled = false;
                $('btnStopPreview').disabled = true;
                log('摄像头已关闭', 'info');
            }
        }
        // ========== 建立 WebRTC 连接 ==========
        async function connect() {
            const serverUrl = $('serverUrl').value.replace(/\/+$/, '');
            if (!serverUrl) {
                log('请输入服务器地址', 'error');
                return;
            }
            log('========== 开始 WebRTC 连接流程 ==========', 'info');
            $('btnConnect').disabled = true;
            updateStatus('connecting');
            try {

                // ========== 步骤 1: 获取本地媒体流 ==========
                if (!localStream) {
                    log('1. 获取本地媒体流...', 'info');
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 640, height: 480 },
                        audio: true
                    });
                    $('localVideo').srcObject = localStream;
                    log(' ✓ 本地媒体流已获取', 'info');
                } else {
                    log('1. 使用已有的本地媒体流', 'info');
                }

                // ========== 步骤 2: 创建 PeerConnection ==========
                log('2. 创建 PeerConnection...', 'info');
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' }
                    ]
                });
                log(' ✓ PeerConnection 已创建', 'info');
                // ========== 步骤 3: 添加本地轨道 ==========
                log('3. 添加本地媒体轨道...', 'info');
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                    log(` + 添加轨道: ${track.kind}`, 'info');
                });

                // 设置回调
                setupPeerConnectionCallbacks();

                // ========== 步骤 4: 创建 Offer ==========
                log('4. 创建 SDP Offer...', 'sdp');
                const offer = await pc.createOffer();
                log(' ✓ Offer 已创建', 'sdp');

                // 显示 Offer SDP
                $('offerSdp').textContent = offer.sdp;
                log(' → Offer SDP 已显示在下方面板', 'sdp');

                // ========== 步骤 5: 设置本地描述 ==========
                log('5. 设置本地描述 setLocalDescription...', 'sdp');
                await pc.setLocalDescription(offer);
                log(' ✓ 本地描述已设置', 'sdp');

                // ========== 步骤 6: 发送 Offer 到服务器 ==========
                log('6. 发送 Offer 到服务器...', 'info');
                const resp = await fetch(`${serverUrl}/offer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (!resp.ok) {
                    throw new Error(`服务器返回错误: ${resp.status}`);
                }

                // 获取 Peer ID（从 Location 头）
                const location = resp.headers.get('Location');
                if (location) {
                    peerId = location.replace('/ice/', '');
                    log(` ✓ 获得 Peer ID: ${peerId}`, 'info');
                }

                // ========== 步骤 7: 获取 Answer ==========
                const answerSdp = await resp.text();
                log(' ✓ 收到 Answer SDP', 'sdp');
                $('answerSdp').textContent = answerSdp;
                log(' → Answer SDP 已显示在下方面板', 'sdp');

                // ========== 步骤 8: 设置远端描述 ==========
                log('7. 设置远端描述 setRemoteDescription...', 'sdp');
                await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
                log(' ✓ 远端描述已设置', 'sdp');
                log('========== 连接流程完成，等待 ICE 连接 ==========', 'info');

                $('btnConnect').disabled = true;
                $('btnDisconnect').disabled = false;
            } catch (e) {
                log('连接失败: ' + e.message, 'error');
                updateStatus('failed');
                $('btnConnect').disabled = false;
            }
        }

        // ========== 设置 PeerConnection 回调 ==========
        function setupPeerConnectionCallbacks() {

            // ICE 连接状态变化
            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                log(`ICE 连接状态: ${state}`, state === 'connected' ? 'info' : 'warn');
                updateStatus(state);
                updateStats();
            };

            // 信令状态变化
            pc.onsignalingstatechange = () => {
                log(`信令状态: ${pc.signalingState}`, 'info');
                updateStats();
            };

            // 本地 ICE 候选生成
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    localCandidateCount++;
                    log(`本地 ICE 候选 #${localCandidateCount}:
    ${event.candidate.candidate.substring(0, 60)}...`, 'info');
                    updateStats();

                    // 发送候选到服务器（Trickle ICE）
                    if (peerId) {
                        sendIceCandidate(event.candidate);
                    }
                } else {
                    log('ICE 候选收集完成', 'info');
                }
            };

            // ICE 收集状态变化
            pc.onicegatheringstatechange = () => {
                log(`ICE 收集状态: ${pc.iceGatheringState}`, 'info');
            };

            // 连接状态变化
            pc.onconnectionstatechange = () => {
                log(`连接状态: ${pc.connectionState}`, 'info');
            };
            // 收到远端轨道
            pc.ontrack = (event) => {
                log(`收到远端轨道: ${event.track.kind}`, 'info');
            };
        }

        // ========== 发送 ICE 候选到服务器 ==========
        async function sendIceCandidate(candidate) {
            const serverUrl = $('serverUrl').value.replace(/\/+$/, '');

            try {
                const body = `a=mid:${candidate.sdpMid}\r\na=${candidate.candidate}\r\n`;

                const resp = await fetch(`${serverUrl}/ice/${peerId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/trickle-ice-sdpfrag' },
                    body: body
                });
                if (resp.ok && resp.status !== 204) {
                    // 解析服务器返回的候选

                    const text = await resp.text();
                    parseAndAddRemoteCandidates(text);
                }
            } catch (e) {
                log('发送 ICE 候选失败: ' + e.message, 'warn');
            }
        }

        // ========== 解析并添加远端候选 ==========
        function parseAndAddRemoteCandidates(text) {
            const lines = text.split('\r\n');
            let currentMid = '0';

            for (const line of lines) {
                if (line.startsWith('a=mid:')) {
                    currentMid = line.substring(6);
                } else if (line.startsWith('a=candidate:')) {
                    const candidate = line.substring(2); // 去掉 "a="
                    try {
                        pc.addIceCandidate({
                            candidate: candidate,
                            sdpMid: currentMid,
                            sdpMLineIndex: parseInt(currentMid) || 0
                        });
                        remoteCandidateCount++;
                        log(`添加远端候选 #${remoteCandidateCount}`, 'info');
                        updateStats();
                    } catch (e) {
                        log('添加远端候选失败: ' + e.message, 'warn');
                    }
                }
            }
        }

        // ========== 断开连接 ==========
        function disconnect() {
            log('正在断开连接...', 'info');

            if (pc) {
                pc.close();
                pc = null;
            }

            peerId = null;
            localCandidateCount = 0;
            remoteCandidateCount = 0;

            updateStatus('closed');
            updateStats();

            $('btnConnect').disabled = false;
            $('btnDisconnect').disabled = true;
            $('offerSdp').textContent = '等待连接...';
            $('answerSdp').textContent = '等待连接...';
            log('连接已断开', 'info');
        }
    </script>
</body>

</html>
